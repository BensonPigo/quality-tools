# 三道檢查（C# / .NET）：每個要合併進 main 的 PR 都會自動執行。
# 放到目標 repo 的 .gitea/workflows/quality.yml；用 GitHub 的話放 .github/workflows/quality.yml。
# 三個指令都讀 .quality.json 的 gates：沒啟用的關印「還沒啟用」並以 0 結束，所以一次上一關時，這份 workflow 不用改。
name: 三道檢查

on:
  pull_request:
    branches: [main]

jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # 要比對 git 歷史才知道改了哪些地方，不能只抓最新一版
          submodules: true # 一起抓 tools/quality 指向的工具版本
          # 抓不到 submodule 時：最簡單是把 quality-tools 設成公司 Gitea 內公開。不能公開的話，
          # 建一個能讀「這個 repo 和 quality-tools」的存取權杖，存成密鑰，再打開下一行
          # token: ${{ secrets.QUALITY_TOOLS_TOKEN }}

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 9.0.x # 改成專案用的版本；repo 有 global.json 的話，改用 global-json-file: global.json

      # Stryker.NET 和 CsMetrics 第一次執行時會下載、建置，存起來下次就不用重來
      - uses: actions/cache@v4
        with:
          path: ~/.cache/quality-tools
          key: quality-tools-${{ hashFiles('tools/quality/qtools/langs/csharp.py', 'tools/quality/qtools/helpers/**') }}

      - name: 第一關：單元測試
        run: python3 tools/quality/quality.py test

      - name: 第二關：CRAP
        run: python3 tools/quality/quality.py crap --base origin/${{ github.base_ref }}

      - name: 第三關：抓錯檢查
        run: python3 tools/quality/quality.py mutation --base origin/${{ github.base_ref }}
