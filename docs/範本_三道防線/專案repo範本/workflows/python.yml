# 三道檢查（Python）：每個要合併進 main 的 PR 都會自動執行。
# 放到目標 repo 的 .gitea/workflows/quality.yml；用 GitHub 的話放 .github/workflows/quality.yml。
# 三個指令都讀 .quality.json 的 gates：沒啟用的關印「還沒啟用」並以 0 結束，所以一次上一關時，這份 workflow 不用改。
name: 三道檢查

on:
  pull_request:
    branches: [main]

jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # 要比對 git 歷史才知道改了哪些地方，不能只抓最新一版
          submodules: true # 一起抓 tools/quality 指向的工具版本
          # 抓不到 submodule 時：最簡單是把 quality-tools 設成公司 Gitea 內公開。不能公開的話，
          # 建一個能讀「這個 repo 和 quality-tools」的存取權杖，存成密鑰，再打開下一行
          # token: ${{ secrets.QUALITY_TOOLS_TOKEN }}

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12" # 改成專案用的版本
          cache: pip

      # 專案的相依套件，加上 pytest、coverage、cosmic-ray。改成專案實際的安裝方式
      - run: pip install -r requirements-dev.txt

      - name: 第一關：單元測試
        run: python tools/quality/quality.py test

      - name: 第二關：CRAP
        run: python tools/quality/quality.py crap --base origin/${{ github.base_ref }}

      - name: 第三關：抓錯檢查
        run: python tools/quality/quality.py mutation --base origin/${{ github.base_ref }}
